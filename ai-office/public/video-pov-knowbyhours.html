<!doctype html>

<body>
<canvas id="c" width="1080" height="1920"></canvas>

<script type="module">
import * as THREE from "three";

// ============================================================ util waktu
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const DURASI = 24;

// ============================================================ layar laptop (kanvas 2D)
const W = 1280, H = 800;
const ui = document.createElement("canvas");
ui.width = W; ui.height = H;
const g = ui.getContext("2d");
const SANS = '"Plus Jakarta Sans", "DejaVu Sans", sans-serif';
const MONO = '"DejaVu Sans Mono", "Liberation Mono", monospace';
const CORAL = "#d97757";
const AGEN = {
  Taufik: { warna: "#16a34a", peran: "Social Media" },
  Umar: { warna: "#2563eb", peran: "SEO & Tren" },
  Yoga: { warna: "#d97706", peran: "Paid Ads" },
  Nadia: { warna: "#db2777", peran: "Head of Growth" },
};

function rrect(x, y, w, h, r, isi, garis) {
  g.beginPath();
  g.roundRect(x, y, w, h, r);
  if (isi) { g.fillStyle = isi; g.fill(); }
  if (garis) { g.strokeStyle = garis; g.lineWidth = 1.5; g.stroke(); }
}
function teks(s, x, y, warna, ukuran, berat = 600, font = SANS, align = "left") {
  g.font = `${berat} ${ukuran}px ${font}`;
  g.fillStyle = warna;
  g.textAlign = align;
  g.fillText(s, x, y);
}
function bungkus(s, lebar, ukuran, font = MONO, berat = 400) {
  g.font = `${berat} ${ukuran}px ${font}`;
  const kata = s.split(" ");
  const baris = [];
  let cur = "";
  for (const k of kata) {
    const coba = cur ? cur + " " + k : k;
    if (g.measureText(coba).width > lebar && cur) { baris.push(cur); cur = k; } else cur = coba;
  }
  if (cur) baris.push(cur);
  return baris;
}

// ---------- terminal Claude Code (kiri)
const PROMPT = "Tim sosmed, analisis performa IG @knowbyhours minggu ini. Cari 5 postingan terbaik dan jam posting terbaik, lalu susun rencana konten minggu depan.";
const TODO = [
  { teks: "Tarik data Insights @knowbyhours", agen: "Taufik", selesai: 11.0 },
  { teks: "Riset topik berita yang naik", agen: "Umar", selesai: 12.3 },
  { teks: "Cek hasil boost postingan", agen: "Yoga", selesai: 13.2 },
  { teks: "Susun laporan & kalender konten", agen: "Nadia", selesai: 17.4 },
];
const LOG = [
  { t: 3.9, jenis: "jawab", s: "Oke! Gue bagi ke 4 anggota tim analis sosmed." },
  { t: 4.4, jenis: "todo" },
  { t: 5.3, jenis: "tool", agen: "Taufik", s: "Read(insights_knowbyhours.csv)" },
  { t: 5.8, jenis: "hasil", s: "20 postingan · 3.458 pengikut" },
  { t: 6.5, jenis: "tool", agen: "Taufik", s: "Read(komentar_7hari.csv)" },
  { t: 6.9, jenis: "hasil", s: "862 komentar" },
  { t: 7.5, jenis: "tool", agen: "Umar", s: 'WebSearch("topik viral pekan ini")' },
  { t: 8.0, jenis: "hasil", s: "12 hasil" },
  { t: 8.7, jenis: "tool", agen: "Yoga", s: "Read(boost_post_export.csv)" },
  { t: 9.1, jenis: "hasil", s: "3 boost · biaya/klik turun 22%" },
  { t: 9.9, jenis: "tool", agen: "Taufik", s: "Bash(python engagement.py)" },
  { t: 10.4, jenis: "hasil", s: "top 5 postingan ditemukan" },
  { t: 11.3, jenis: "tool", agen: "Umar", s: "Grep(#knowbyhours)" },
  { t: 11.8, jenis: "hasil", s: "topik gaming & UMR paling ramai" },
  { t: 13.6, jenis: "tool", agen: "Nadia", s: "Write(laporan-mingguan.md)" },
  { t: 14.1, jenis: "hasil", s: "48 baris" },
  { t: 15.1, jenis: "tool", agen: "Nadia", s: "Write(kalender-minggu48.csv)" },
  { t: 15.5, jenis: "hasil", s: "4 jadwal posting" },
  { t: 17.9, jenis: "selesai", s: "Selesai  4 agent · 20 postingan · 2 file" },
  { t: 18.5, jenis: "insight", s: "Insight: carousel judul pertanyaan ('Cukup buat Jakarta?') paling banyak disimpan. Jam terbaik 19.00–21.00." },
];

function terminal(t) {
  const X = 0, Y = 40, LW = 500, LH = H - 40;
  g.fillStyle = "#18191b";
  g.fillRect(X, Y, LW, LH);
  g.save();
  g.beginPath(); g.rect(X, Y, LW, LH); g.clip();

  const baris = []; // { s, warna, ukuran, berat, font, x, coret }
  const PX = 22, LEBAR = LW - 44;
  const tambah = (s, warna, opsi = {}) => baris.push({ s, warna, ...opsi });

  // kotak sambutan
  baris.push({ jenis: "header" });
  // prompt yang diketik
  const nKetik = Math.floor(clamp((t - 0.6) / 2.6) * PROMPT.length);
  const ketik = PROMPT.slice(0, nKetik);
  const kursor = t < 3.4 && Math.floor(t * 3) % 2 === 0 ? "▍" : "";
  bungkus("> " + ketik + kursor, LEBAR, 15).forEach((b, i) => tambah(i ? "  " + b : b, "#f2f2f2", { ukuran: 15 }));
  baris.push({ jarak: 10 });

  for (const ev of LOG) {
    if (t < ev.t) break;
    if (ev.jenis === "jawab") {
      bungkus("⏺ " + ev.s, LEBAR, 15).forEach((b) => tambah(b, "#f2f2f2", { ukuran: 15 }));
    } else if (ev.jenis === "todo") {
      tambah("  Update Todos", "#9aa0a6", { ukuran: 14 });
      TODO.forEach((td, i) => {
        if (t < ev.t + 0.18 * (i + 1)) return;
        const ok = t >= td.selesai;
        tambah(`  ${ok ? "☒" : "☐"} ${td.teks}`, ok ? "#6ee7a8" : "#d4d4d4", { ukuran: 14, coret: ok, agen: td.agen });
      });
      baris.push({ jarak: 6 });
    } else if (ev.jenis === "tool") {
      tambah(`⏺ ${ev.agen} · ${ev.s}`, "#e5e5e5", { ukuran: 14.5, agen: ev.agen });
    } else if (ev.jenis === "hasil") {
      tambah(`  ⎿  ${ev.s}`, "#9aa0a6", { ukuran: 14 });
    } else if (ev.jenis === "selesai") {
      baris.push({ jarak: 6 });
      tambah(`✓ ${ev.s}`, "#6ee7a8", { ukuran: 15, berat: 700 });
    } else if (ev.jenis === "insight") {
      bungkus(ev.s, LEBAR - 10, 14.5).forEach((b) => tambah("  " + b, "#ffffff", { ukuran: 14.5 }));
    }
  }

  // tinggi total + auto-scroll
  const tinggi = (b) => (b.jenis === "header" ? 96 : b.jarak ?? Math.round((b.ukuran ?? 15) * 1.65));
  const total = baris.reduce((s, b) => s + tinggi(b), 0) + 60;
  let y = Y + 20 - Math.max(0, total - (LH - 54));
  for (const b of baris) {
    if (b.jenis === "header") {
      rrect(PX - 6, y, LEBAR + 12, 80, 8, null, CORAL);
      teks("✻", PX + 8, y + 32, CORAL, 22, 700, MONO);
      teks("Selamat datang di Claude Code", PX + 36, y + 32, "#f2f2f2", 15, 700, MONO);
      teks("cwd: ~/knowbyhours/tim-sosmed", PX + 36, y + 58, "#8a8f98", 13, 400, MONO);
    } else if (b.s !== undefined) {
      const fs = b.ukuran ?? 15;
      let x = PX;
      if (b.agen && b.s.startsWith("⏺ ")) {
        // titik & nama agen berwarna
        teks("⏺", x, y + fs, AGEN[b.agen].warna, fs, 400, MONO);
        g.font = `400 ${fs}px ${MONO}`;
        const lebarTitik = g.measureText("⏺ ").width;
        teks(b.agen, x + lebarTitik, y + fs, AGEN[b.agen].warna, fs, 700, MONO);
        const lebarNama = g.measureText(b.agen).width;
        teks(b.s.slice(2 + b.agen.length), x + lebarTitik + lebarNama, y + fs, b.warna, fs, 400, MONO);
      } else {
        teks(b.s, x, y + fs, b.warna, fs, b.berat ?? 400, MONO);
        if (b.coret) {
          g.font = `400 ${fs}px ${MONO}`;
          const w = g.measureText(b.s).width;
          g.fillStyle = "#6ee7a8"; g.fillRect(x + 34, y + fs * 0.62, w - 34, 1.2);
        }
      }
    }
    y += tinggi(b);
  }
  g.restore();

  // status bawah: spinner saat tim bekerja
  if (t > 4 && t < 17.9) {
    const bintang = "✢✳✶✻✽✻✶✳"[Math.floor(t * 8) % 8];
    const detik = Math.floor((t - 4) * 17);
    g.fillStyle = "#18191b"; g.fillRect(0, H - 50, LW, 50);
    teks(`${bintang} Tim menganalisis… (${detik}s · esc untuk berhenti)`, PX, H - 22, CORAL, 14, 400, MONO);
  } else if (t >= 17.9) {
    g.fillStyle = "#18191b"; g.fillRect(0, H - 50, LW, 50);
    rrect(PX - 6, H - 44, LEBAR + 12, 32, 6, null, "#3a3d42");
    teks(">", PX + 4, H - 22, "#8a8f98", 15, 400, MONO);
  }
}

// ---------- dashboard sosmed (kanan)
const DX = 500, DW = W - 500;
const KPI = [
  { label: "Pengikut", nilai: 3458, fmt: (v) => Math.round(v).toLocaleString("id-ID"), delta: "▲ 312 pekan ini" },
  { label: "Reach", nilai: 48.2, fmt: (v) => `${v.toFixed(1).replace(".", ",")} rb`, delta: "▲ 18%" },
  { label: "Engagement", nilai: 7.4, fmt: (v) => `${v.toFixed(1).replace(".", ",")}%`, delta: "▲ 0,9 pt" },
  { label: "Disimpan", nilai: 1240, fmt: (v) => Math.round(v).toLocaleString("id-ID"), delta: "▲ 34%" },
];
const IG = [3.1, 4.2, 3.8, 5.6, 4.9, 7.4, 6.8];
const TT = [2.2, 2.9, 4.1, 3.6, 5.2, 5.9, 7.9];
const TOP = [
  ["Dari jauh kayak daun pisang, ternyata celana", "Carousel", "12,8%", "#2f5d27"],
  ["Nunggu 13 tahun, harganya naik", "Carousel", "11,1%", "#6d28d9"],
  ["Naik Rp407 ribu, cukup buat Jakarta?", "Carousel", "9,6%", "#b91c1c"],
  ["Jalan ditutup demi kepiting", "Reels", "8,4%", "#c2410c"],
  ["Olahraga sekarang buat cari temen?", "Reels", "7,9%", "#111111"],
];
const RENCANA = [
  ["Sen", "19.00", "Carousel isu ekonomi pekan ini"],
  ["Rab", "12.00", "Reels explainer 60 detik"],
  ["Jum", "20.00", "Carousel tren gaming & pop"],
  ["Min", "10.00", "Recap: seminggu dalam 5 slide"],
];

function kartu(x, y, w, h, judul) {
  rrect(x, y, w, h, 12, "#ffffff", "#e6e8ec");
  if (judul) teks(judul, x + 16, y + 26, "#1f2633", 15, 700);
}

function dashboard(t) {
  g.fillStyle = "#f4f5f8";
  g.fillRect(DX, 40, DW, H - 40);
  const x0 = DX + 22;

  // header
  rrect(x0, 56, 36, 36, 18, "#f7d532", "#111");
  teks("K", x0 + 18, 82, "#111", 22, 800, SANS, "center");
  teks("@knowbyhours", x0 + 46, 74, "#111827", 19, 800);
  teks("Instagram Insights · 18–24 Nov", x0 + 46, 92, "#6b7280", 12.5, 600);
  ["Semua", "Carousel", "Reels"].forEach((tab, i) => {
    const aktif = (t > 7.6 && t < 10.5 ? 1 : 0) === i;
    const tx = DX + DW - 330 + i * 104;
    rrect(tx, 60, 96, 30, 15, aktif ? "#111827" : "#ffffff", aktif ? null : "#e0e3e8");
    teks(tab, tx + 48, 80, aktif ? "#fff" : "#4b5563", 13, 700, SANS, "center");
  });

  // KPI
  const kw = (DW - 44 - 3 * 12) / 4;
  KPI.forEach((k, i) => {
    const kx = x0 + i * (kw + 12), ky = 108;
    kartu(kx, ky, kw, 92);
    const p = ease(prog(t, 5.4 + i * 0.35, 7.4 + i * 0.35));
    teks(k.label, kx + 14, ky + 26, "#6b7280", 13, 700);
    teks(p > 0 ? k.fmt(k.nilai * p) : "–", kx + 14, ky + 60, "#111827", 26, 800);
    if (p > 0.95) teks(k.delta, kx + 14, ky + 82, "#16a34a", 12.5, 700);
  });

  // grafik garis engagement harian
  const gx = x0, gy = 214, gw = 430, gh = 190;
  kartu(gx, gy, gw, gh, "Engagement harian");
  const px = gx + 24, py = gy + 46, pw = gw - 48, ph = gh - 74;
  g.strokeStyle = "#eef0f3"; g.lineWidth = 1;
  for (let i = 0; i <= 3; i++) { g.beginPath(); g.moveTo(px, py + (ph * i) / 3); g.lineTo(px + pw, py + (ph * i) / 3); g.stroke(); }
  ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].forEach((d, i) => teks(d, px + (pw * i) / 6, py + ph + 18, "#9ca3af", 11, 600, SANS, "center"));
  const garis = (data, warna, a) => {
    const p = ease(prog(t, a, a + 2.4));
    if (p <= 0) return;
    const n = (data.length - 1) * p;
    g.strokeStyle = warna; g.lineWidth = 3; g.lineJoin = "round"; g.beginPath();
    for (let i = 0; i <= Math.ceil(n); i++) {
      const j = Math.min(i, n);
      const v = data[Math.floor(j)] + (data[Math.min(Math.ceil(j), data.length - 1)] - data[Math.floor(j)]) * (j - Math.floor(j));
      const xx = px + (pw * j) / 6, yy = py + ph - (v / 8.5) * ph;
      i ? g.lineTo(xx, yy) : g.moveTo(xx, yy);
    }
    g.stroke();
  };
  garis(IG, "#e0b400", 6.8);
  garis(TT, "#111827", 7.4);
  if (t > 7) { teks("● Carousel", gx + gw - 150, gy + 26, "#e0b400", 12, 700); teks("● Reels", gx + gw - 66, gy + 26, "#111827", 12, 700); }

  // donat sentimen
  const sx = gx + gw + 14, sw = DW - 44 - gw - 14;
  kartu(sx, gy, sw, gh, "Sentimen komentar");
  const cx = sx + 82, cy = gy + 112, r = 54;
  const pd = ease(prog(t, 8.6, 10.2));
  let mulai = -Math.PI / 2;
  [[0.72, "#22c55e"], [0.21, "#cbd5e1"], [0.07, "#ef4444"]].forEach(([v, c]) => {
    const akhir = mulai + v * Math.PI * 2 * pd;
    g.strokeStyle = c; g.lineWidth = 20; g.lineCap = "butt"; g.beginPath(); g.arc(cx, cy, r, mulai, akhir); g.stroke();
    mulai = akhir;
  });
  if (pd > 0.9) {
    teks("72%", cx, cy + 8, "#111827", 22, 800, SANS, "center");
    [["Positif 72%", "#22c55e"], ["Netral 21%", "#94a3b8"], ["Negatif 7%", "#ef4444"]].forEach(([l, c], i) => teks(l, sx + 158, gy + 92 + i * 24, c, 13, 700));
  }

  // top 5 konten
  const ty = 416, tw = 430, th = 226;
  kartu(gx, ty, tw, th, "Top 5 postingan minggu ini");
  TOP.forEach(([judul, platform, er, warna], i) => {
    const a = prog(t, 9.6 + i * 0.4, 10.2 + i * 0.4);
    if (a <= 0) return;
    g.globalAlpha = a;
    const ry = ty + 42 + i * 36;
    if (i === 0 && t > 11.6) rrect(gx + 8, ry - 4, tw - 16, 34, 8, "#fffbe0", "#f7d532");
    teks(`${i + 1}`, gx + 18, ry + 19, "#9ca3af", 14, 800);
    // sampul mini bergaya KnowByHours: foto (warna) + pita judul kuning
    rrect(gx + 38, ry, 40, 26, 4, warna);
    g.fillStyle = "#f7d532"; g.fillRect(gx + 38, ry + 16, 40, 10);
    g.fillStyle = "#111"; g.fillRect(gx + 41, ry + 19, 26, 2); g.fillRect(gx + 41, ry + 22, 18, 2);
    teks(judul.length > 34 ? judul.slice(0, 33) + "…" : judul, gx + 90, ry + 13, "#111827", 13.5, 700);
    teks(platform, gx + 90, ry + 28, "#9ca3af", 11.5, 600);
    teks(er, gx + tw - 18, ry + 19, "#16a34a", 14, 800, SANS, "right");
    g.globalAlpha = 1;
  });

  // heatmap jam posting
  kartu(sx, ty, sw, th, "Jam posting terbaik");
  const jam = ["07", "12", "15", "19", "21", "23"];
  const hari = ["S", "S", "R", "K", "J", "S", "M"];
  const hx = sx + 44, hy = ty + 46, cw = (sw - 64) / 7, ch = 24;
  jam.forEach((j, r) => teks(j, sx + 16, hy + r * (ch + 4) + 17, "#9ca3af", 11, 700));
  hari.forEach((h, c) => teks(h, hx + c * cw + cw / 2 - 2, hy + 6 * (ch + 4) + 12, "#9ca3af", 11, 700, SANS, "center"));
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) {
    const a = prog(t, 11.0 + (r * 7 + c) * 0.028, 11.5 + (r * 7 + c) * 0.028);
    if (a <= 0) continue;
    const kuat = clamp(0.15 + (r === 3 || r === 4 ? 0.55 : r === 1 ? 0.25 : 0.05) + ((c * 37 + r * 11) % 10) / 40 + (c >= 4 ? 0.1 : 0));
    g.globalAlpha = a;
    rrect(hx + c * cw, hy + r * (ch + 4), cw - 4, ch, 4, `rgba(224,180,0,${kuat})`);
    g.globalAlpha = 1;
  }
  if (t > 12.8) rrect(hx - 3, hy + 3 * (ch + 4) - 3, 7 * cw - 2, 2 * (ch + 4) + 2, 6, null, "#111827");

  // rencana minggu depan
  const ry0 = 656;
  kartu(gx, ry0, DW - 44, 132, "Rencana minggu depan");
  RENCANA.forEach(([hr, jm, isi], i) => {
    const a = prog(t, 15.3 + i * 0.45, 15.8 + i * 0.45);
    if (a <= 0) return;
    g.globalAlpha = a;
    const col = i % 2, row = Math.floor(i / 2);
    const bx = gx + 16 + col * ((DW - 76) / 2), by = ry0 + 44 + row * 40;
    rrect(bx, by, (DW - 92) / 2, 32, 8, "#f8fafc", "#e5e7eb");
    rrect(bx + 6, by + 5, 46, 22, 6, "#111827");
    teks(hr, bx + 29, by + 21, "#fff", 12, 800, SANS, "center");
    teks(jm, bx + 62, by + 21, "#b08d00", 13, 800);
    teks(isi, bx + 112, by + 21, "#1f2937", 13, 700);
    g.globalAlpha = 1;
  });

  // toast laporan terkirim
  const tp = ease(prog(t, 18.8, 19.4));
  if (tp > 0) {
    const tx = DX + DW - 22 - 360, tyy = 20 + 92 * tp;
    g.globalAlpha = tp;
    rrect(tx, tyy, 360, 56, 12, "#111827");
    rrect(tx + 12, tyy + 12, 32, 32, 16, "#22c55e");
    teks("✓", tx + 28, tyy + 34, "#fff", 18, 800, SANS, "center");
    teks("Laporan terkirim", tx + 56, tyy + 24, "#fff", 14, 800);
    teks("ke grup Telegram Tim KnowByHours", tx + 56, tyy + 43, "#9ca3af", 12.5, 600);
    g.globalAlpha = 1;
  }
}

// ---------- kursor agen yang bergerak di dashboard
const JALUR = {
  Taufik: [[4.9, 1000, 420], [5.8, 590, 160, 1], [7.0, 640, 300], [8.2, 760, 330], [10.0, 650, 470, 1], [11.7, 680, 462, 1], [13.0, 760, 560], [17.6, 860, 540]],
  Umar: [[6.6, 1200, 300], [7.6, 1010, 76, 1], [9.0, 980, 160], [11.0, 1080, 520, 1], [12.9, 1120, 590, 1], [17.6, 1180, 470]],
  Yoga: [[8.3, 1240, 120], [9.0, 1180, 160, 1], [10.1, 1080, 330, 1], [12.0, 1150, 300], [13.3, 1020, 250], [17.6, 1100, 200]],

};
function posisiKursor(kunci, t) {
  if (t < kunci[0][0] || t > kunci[kunci.length - 1][0] + 0.6) return null;
  let i = 0;
  while (i < kunci.length - 1 && t > kunci[i + 1][0]) i++;
  const a = kunci[i], b = kunci[Math.min(i + 1, kunci.length - 1)];
  const p = b === a ? 1 : ease(prog(t, a[0], b[0]));
  // jeda kecil di setiap titik supaya terlihat seperti manusia/agen yang membaca
  return { x: a[1] + (b[1] - a[1]) * p, y: a[2] + (b[2] - a[2]) * p, klik: kunci.find((k) => k[3] && t >= k[0] && t < k[0] + 0.45) };
}
function kursor(t) {
  for (const [nama, kunci] of Object.entries(JALUR)) {
    const pos = posisiKursor(kunci, t);
    if (!pos) continue;
    const warna = AGEN[nama].warna;
    const muncul = clamp((t - kunci[0][0]) / 0.3) * clamp((kunci[kunci.length - 1][0] + 0.6 - t) / 0.3);
    g.globalAlpha = muncul;
    if (pos.klik) {
      const r = 6 + (t - pos.klik[0]) * 60;
      g.strokeStyle = warna; g.lineWidth = 3; g.globalAlpha = muncul * (1 - (t - pos.klik[0]) / 0.45);
      g.beginPath(); g.arc(pos.x, pos.y, r, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = muncul;
    }
    g.fillStyle = warna; g.strokeStyle = "#fff"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(pos.x, pos.y); g.lineTo(pos.x, pos.y + 22); g.lineTo(pos.x + 6, pos.y + 16); g.lineTo(pos.x + 15, pos.y + 16); g.closePath();
    g.fill(); g.stroke();
    g.font = `800 12.5px ${SANS}`;
    const lw = g.measureText(nama).width + 16;
    rrect(pos.x + 12, pos.y + 18, lw, 22, 11, warna);
    teks(nama, pos.x + 20, pos.y + 33, "#fff", 12.5, 800);
    g.globalAlpha = 1;
  }
}
