<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Poster Divisi</title>
<script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js" } }
</script>
<style>
  :root {
    --merah: #e74c3c;      /* warna utama divisi (diatur dari data) */
    --latar1: #ffe3dc; --latar2: #fbd0c6; --latar3: #e8a99c;
    --kartu2: #fff4f1; --bayang: #8a2b1f2e; --footer: #6b3a32;
    --tinta: #1f2633;
    --redup: #5b6475;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; background: #fff; }
  body { font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--tinta); }
  .poster {
    position: relative; width: 1080px; height: 1920px; overflow: hidden; padding: 72px 64px 56px;
    background:
      linear-gradient(#ffffff59 2px, transparent 2px) 0 0 / 108px 108px,
      linear-gradient(90deg, #ffffff59 2px, transparent 2px) 0 0 / 108px 108px,
      radial-gradient(ellipse 120% 70% at 50% 18%, var(--latar1) 0%, var(--latar2) 35%, var(--latar3) 100%);
    display: flex; flex-direction: column; gap: 30px;
  }
  .poster::after { /* bentuk dekoratif */
    content: ""; position: absolute; width: 760px; height: 760px; border-radius: 50%;
    right: -300px; top: -260px; background: #ffffff38; pointer-events: none;
  }
  header, .kartu, .grid { flex-shrink: 0; }
  header { position: relative; z-index: 1; }
  .kicker { display: inline-flex; gap: 12px; align-items: center; font-size: 26px; font-weight: 700;
    letter-spacing: 6px; text-transform: uppercase; color: var(--merah); }
  .kicker i { width: 44px; height: 6px; border-radius: 3px; background: var(--merah); display: block; }
  h1 { font-size: 100px; line-height: .95; font-weight: 900; letter-spacing: -2px; margin-top: 18px; }
  h1 span { color: var(--merah); }
  .sub { font-size: 30px; color: var(--redup); margin-top: 18px; max-width: 930px; line-height: 1.35; }

  .kartu { position: relative; z-index: 1; background: #ffffffd9; border-radius: 32px;
    box-shadow: 0 18px 50px var(--bayang), 0 2px 0 #fff inset; overflow: hidden; }
  .kartu canvas { display: block; }
  .pita { display: inline-block; font-size: 19px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
    color: #fff; background: var(--merah); border-radius: 999px; padding: 7px 16px; }

  .utama { display: grid; grid-template-columns: 440px 1fr; align-items: center; height: 470px;
    background: linear-gradient(135deg, #fff 0%, var(--kartu2) 100%); }
  .utama .teks { padding: 0 44px 0 6px; }
  .utama .nama { font-size: 80px; font-weight: 900; letter-spacing: -1.5px; margin-top: 22px; line-height: 1; }
  .utama .jabatan { font-size: 40px; font-weight: 700; color: var(--merah); margin-top: 10px; }
  .utama .desk { font-size: 24px; color: var(--redup); margin-top: 20px; line-height: 1.4; }

  .grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 26px; }
  .grid .kartu { grid-column: span 2; height: 404px; display: flex; flex-direction: column; }
  .grid .kartu:nth-child(4) { grid-column: 2 / span 2; }
  .grid .kartu:nth-child(5) { grid-column: 4 / span 2; }
  .grid .info { padding: 4px 22px 24px; text-align: center; }
  .grid .nama { font-size: 40px; font-weight: 900; letter-spacing: -.5px; }
  .grid .jabatan { font-size: 21px; font-weight: 800; color: var(--merah); margin-top: 4px; line-height: 1.2;
    min-height: 26px; }
  .grid .desk { font-size: 18px; color: var(--redup); margin-top: 8px; line-height: 1.35; }

  footer { position: relative; z-index: 1; margin-top: auto; display: flex; justify-content: space-between;
    align-items: center; font-size: 22px; color: var(--footer); font-weight: 600; }
  footer b { color: var(--tinta); }
  .titik { display: inline-flex; gap: 8px; }
  .titik i { width: 12px; height: 12px; border-radius: 50%; background: var(--merah); display: block; opacity: .35; }
  .titik i:first-child { opacity: 1; }
</style>
</head>
<body>
<!-- Poster 9:16 per divisi. Pilih divisi lewat URL: /poster.html?d=kreatif atau /poster.html?d=growth -->
<div class="poster" id="poster">
  <header>
    <div class="kicker"><i></i><span id="kicker"></span></div>
    <h1 id="judul"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <section class="kartu utama">
    <canvas id="kanvas-kepala" width="440" height="470"></canvas>
    <div class="teks">
      <span class="pita">Kepala Divisi</span>
      <div class="nama" id="kepala-nama"></div>
      <div class="jabatan" id="kepala-jabatan"></div>
      <p class="desk" id="kepala-desk"></p>
    </div>
  </section>
  <section class="grid" id="grid"></section>
  <footer>
    <span><b>Kantor Virtual AI</b> · <span id="lantai"></span></span>
    <span class="titik"><i></i><i></i><i></i></span>
  </footer>
</div>

<script type="module">
import * as THREE from "three";

// ---------- Data divisi ----------
const DIVISI = {
  kreatif: {

    sub: "Tim AI yang mengubah brief editorial menjadi karya orisinal: tulisan, naskah, visual, video, dan audio.",
    warna: "#e74c3c", latar: ["#ffe3dc", "#fbd0c6", "#e8a99c"], kartu2: "#fff4f1", bayang: "#8a2b1f2e", footer: "#6b3a32",
    bajuKepala: "#e74c3c", bajuTim: "#f1948a", alasKepala: "#e74c3c", alasTim: "#f6c1b6", cahayaBawah: "#f0c2b8",
    kepala: { id: "bayu", nama: "Bayu", jabatan: "Creative Director", rambut: "#2b1b12",
      desk: "Memimpin 5 spesialis kreatif: menyusun konsep, membagi tugas, dan memastikan karya siap diproduksi." },
    tim: [
      { id: "oscar", nama: "Oscar", jabatan: "Writer", desk: "Artikel, review, feature, dan caption panjang", rambut: "#2b1b12" },
      { id: "putri", nama: "Putri", jabatan: "Script & Storyboard", desk: "Naskah video pendek, podcast, dan storyboard", rambut: "#111111", panjang: true },
      { id: "qori", nama: "Qori", jabatan: "Visual Designer", desk: "Konsep visual, carousel, dan thumbnail", rambut: "#7b4a2a", panjang: true },
      { id: "rio", nama: "Rio", jabatan: "Video & Audio Producer", desk: "Rencana produksi, subtitle, dan show notes", rambut: "#3a2a20" },
      { id: "salsa", nama: "Salsa", jabatan: "Localization", desk: "Adaptasi ID ⇄ EN dan bahasa platform", rambut: "#5a3825", panjang: true },
    ],
  },
  growth: {
    nomor: "04", kicker: "Divisi 04 · Tim Sosmed", judul: ["Distribution &amp;", "Growth"], lantai: "Lantai 3",
    sub: "Tim AI yang membawa setiap karya ke audiens yang tepat: sosmed, SEO, newsletter, partnership, dan iklan.",
    warna: "#1e9e5a", latar: ["#e2f7ea", "#c4ecd3", "#8fd3ac"], kartu2: "#effaf3", bayang: "#145a352e", footer: "#1f5a3a",
    bajuKepala: "#27ae60", bajuTim: "#82e0aa", alasKepala: "#27ae60", alasTim: "#bfead0", cahayaBawah: "#bfe6cc",
    kepala: { id: "nadia", nama: "Nadia", jabatan: "Head of Growth", rambut: "#3a2a20", panjang: true,
      desk: "Memimpin 5 spesialis: merencanakan distribusi tiap platform dan memastikan audiens terus tumbuh." },
    tim: [
      { id: "taufik", nama: "Taufik", jabatan: "Social Media Manager", desk: "Jadwal posting dan caption tiap platform", rambut: "#111111" },
      { id: "umar", nama: "Umar", jabatan: "SEO & Search", desk: "Kata kunci, judul, dan optimasi pencarian", rambut: "#2b1b12" },
      { id: "vina", nama: "Vina", jabatan: "Newsletter & CRM", desk: "Newsletter mingguan dan segmen pelanggan", rambut: "#7b4a2a", panjang: true },
      { id: "wulan", nama: "Wulan", jabatan: "Partnership & Syndication", desk: "Pitching ke playlist dan media", rambut: "#5a3825", panjang: true },
      { id: "yoga", nama: "Yoga", jabatan: "Paid Ads Analyst", desk: "Rencana iklan, A/B test, dan anggaran", rambut: "#3a2a20" },
    ],
  },
  bisnis: {
    nomor: "05", kicker: "Divisi 05 · Tim Bisnis", judul: ["Business &amp;", "Monetization"], lantai: "Lantai 1",
    sub: "Tim AI yang mengubah audiens dan karya jadi pendapatan: sponsor, iklan, lisensi, event, dan membership.",
    warna: "#b07800", latar: ["#fff6da", "#ffe8a3", "#f2cc66"], kartu2: "#fffaeb", bayang: "#7a5a0a33", footer: "#6b4e0a",
    bajuKepala: "#f1c40f", bajuTim: "#f7dc6f", alasKepala: "#e0b100", alasTim: "#fbe7a5", cahayaBawah: "#f3e1a8",
    kepala: { id: "hendra", nama: "Hendra", jabatan: "Chief Revenue Officer", rambut: "#111111",
      desk: "Memimpin 5 spesialis: membuka sumber pendapatan baru tanpa mengorbankan kepercayaan audiens." },
    tim: [
      { id: "dina", nama: "Dina", jabatan: "Brand Partnership", desk: "Prospek brand dan proposal sponsorship", rambut: "#3a2a20", panjang: true },
      { id: "eko", nama: "Eko", jabatan: "Ads Sales & Rate Card", desk: "Rate card, paket iklan, dan media kit", rambut: "#2b1b12" },
      { id: "fani", nama: "Fani", jabatan: "Licensing & IP", desk: "Lisensi musik, film, dan sync", rambut: "#111111", panjang: true },
      { id: "gilang", nama: "Gilang", jabatan: "Events & Merchandise", desk: "Konsep event, showcase, dan merchandise", rambut: "#5a3825" },
      { id: "hesti", nama: "Hesti", jabatan: "Membership", desk: "Membership, konten eksklusif, dan kelas", rambut: "#7b4a2a", panjang: true },
    ],
  },
};
const D = DIVISI[new URLSearchParams(location.search).get("d") ?? "kreatif"] ?? DIVISI.kreatif;
document.title = `Poster ${D.judul.join(" ").replace("&amp;", "&")}`;
const akar = document.documentElement.style;
akar.setProperty("--merah", D.warna);
D.latar.forEach((c, i) => akar.setProperty(`--latar${i + 1}`, c));
akar.setProperty("--kartu2", D.kartu2);
akar.setProperty("--bayang", D.bayang);
akar.setProperty("--footer", D.footer);
document.getElementById("kicker").textContent = D.kicker;
document.getElementById("judul").innerHTML = `${D.judul[0]}<br><span>${D.judul[1]}</span>`;
document.getElementById("sub").textContent = D.sub;
document.getElementById("kepala-nama").textContent = D.kepala.nama;
document.getElementById("kepala-jabatan").textContent = D.kepala.jabatan;
document.getElementById("kepala-desk").textContent = D.kepala.desk;
document.getElementById("lantai").textContent = D.lantai;
document.getElementById("kanvas-kepala").dataset.agent = D.kepala.id;
document.getElementById("grid").innerHTML = D.tim.map((a) => `
  <section class="kartu">
    <canvas data-agent="${a.id}" width="300" height="250"></canvas>
    <div class="info"><div class="nama">${a.nama}</div><div class="jabatan">${a.jabatan}</div><p class="desk">${a.desk}</p></div>
  </section>`).join("");

// ---------- Karakter voxel (gaya sama dengan kantor virtual) ----------
const mat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, ...extra });
const kotak = (w, h, d, m, x, y, z, parent) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  parent.add(o);
  return o;
};
const KULIT = mat("#f0c8a4"), MATA = mat("#1d1d1d"), CELANA = mat("#4a5568"), HITAM = mat("#22252b"), PUTIH = mat("#f5f5f2");

function karakter(baju, rambutWarna, panjang) {
  const g = new THREE.Group();
  const b = mat(baju), r = mat(rambutWarna);
  const kaki = [], lengan = [];
  for (const sx of [-0.13, 0.13]) {
    const p = new THREE.Group(); p.position.set(sx, 0.58, 0);
    kotak(0.22, 0.58, 0.26, CELANA, 0, -0.29, 0, p);
    kotak(0.24, 0.08, 0.32, HITAM, 0, -0.56, 0.03, p);
    g.add(p); kaki.push(p);
  }
  kotak(0.56, 0.66, 0.34, b, 0, 0.91, 0, g);
  for (const sx of [-0.37, 0.37]) {
    const p = new THREE.Group(); p.position.set(sx, 1.18, 0);
    kotak(0.17, 0.56, 0.2, b, 0, -0.25, 0, p);
    kotak(0.15, 0.11, 0.18, KULIT, 0, -0.57, 0, p);
    g.add(p); lengan.push(p);
  }
  kotak(0.5, 0.5, 0.46, KULIT, 0, 1.5, 0, g);
  kotak(0.54, 0.15, 0.5, r, 0, 1.8, 0, g);
  kotak(0.54, panjang ? 0.62 : 0.36, 0.1, r, 0, panjang ? 1.5 : 1.62, -0.21, g);
  if (panjang) for (const sx of [-0.26, 0.26]) kotak(0.06, 0.5, 0.36, r, sx, 1.55, -0.04, g);
  for (const sx of [-0.11, 0.11]) kotak(0.07, 0.09, 0.02, MATA, sx, 1.53, 0.24, g);
  kotak(0.16, 0.04, 0.02, mat("#c0605a"), 0, 1.38, 0.24, g); // senyum
  return { g, kaki, lengan };
}

// Properti sesuai jabatan, dipegang di tangan kanan (lengan[1]) atau dipakai
// Properti sesuai jabatan (dipegang tangan kanan = lengan[1], tangan kiri = lengan[0])
const ikon = (warna) => mat(warna, { emissive: warna, emissiveIntensity: 0.25 });
function gelembung(k, x, y, warna, isi) {
  kotak(0.36, 0.26, 0.06, mat(warna), x, y, 0, k.g);
  kotak(0.08, 0.08, 0.06, mat(warna), x + (x < 0 ? 0.1 : -0.1), y - 0.16, 0, k.g);
  isi?.(x, y);
}
const PROP = {
  bayu(k) {
    kotak(0.58, 0.08, 0.56, mat("#7a1f1f"), 0.04, 1.92, 0, k.g); // baret
    kotak(0.14, 0.06, 0.14, mat("#7a1f1f"), 0.04, 1.98, 0, k.g);
    k.lengan[1].rotation.x = -0.45; k.lengan[1].rotation.z = 0.12;
    const papan = new THREE.Group(); papan.position.set(0.12, -0.7, 0.12); papan.rotation.set(0.45, -0.5, 0); papan.scale.setScalar(0.72);
    kotak(0.56, 0.42, 0.05, HITAM, 0, 0.12, 0, papan); // clapperboard
    for (let i = 0; i < 4; i++) kotak(0.1, 0.09, 0.06, PUTIH, -0.2 + i * 0.14, 0.36, 0, papan);
    kotak(0.56, 0.02, 0.06, PUTIH, 0, 0.03, 0.001, papan);
    k.lengan[1].add(papan);
  },
  oscar(k) {
    for (const l of k.lengan) l.rotation.x = -1.0;
    k.lengan[0].rotation.z = 0.25; k.lengan[1].rotation.z = -0.25;
    const buku = new THREE.Group(); buku.position.set(0, 0.86, 0.42); buku.rotation.x = -0.5;
    for (const sx of [-0.17, 0.17]) {
      const h = kotak(0.32, 0.42, 0.03, mat("#2f6fed"), sx, 0, 0, buku); h.rotation.y = sx > 0 ? -0.25 : 0.25;
      const p = kotak(0.28, 0.38, 0.02, PUTIH, sx, 0, 0.02, buku); p.rotation.y = h.rotation.y;
    }
    k.g.add(buku);
    kotak(0.04, 0.04, 0.3, mat("#f5c518"), 0.27, 1.62, 0.02, k.g); // pensil di telinga
  },
  putri(k) {
    k.lengan[1].rotation.x = -1.1;
    const naskah = new THREE.Group(); naskah.position.set(0, -0.6, 0.18); naskah.rotation.x = 1.1;
    kotak(0.4, 0.52, 0.03, mat("#8b5a2b"), 0, 0.1, 0, naskah);
    kotak(0.36, 0.46, 0.02, PUTIH, 0, 0.08, 0.02, naskah);
    for (let i = 0; i < 5; i++) kotak(0.26, 0.025, 0.02, mat("#9aa3b2"), -0.02, 0.24 - i * 0.07, 0.035, naskah);
    kotak(0.16, 0.05, 0.04, mat("#c0c4cc"), 0, 0.34, 0.03, naskah);
    k.lengan[1].add(naskah);
  },
  qori(k) {
    k.lengan[0].rotation.x = -0.9; k.lengan[0].rotation.z = 0.2;
    const palet = new THREE.Group(); palet.position.set(0, -0.62, 0.1); palet.rotation.x = 0.9;
    const d = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.04, 24), mat("#c8935a")); d.rotation.x = Math.PI / 2; palet.add(d);
    ["#e74c3c", "#f1c40f", "#2f6fed", "#27ae60", "#9b59b6"].forEach((c, i) => {
      const a = (i / 5) * Math.PI * 1.6 + 0.4;
      kotak(0.09, 0.09, 0.04, mat(c), Math.cos(a) * 0.18, Math.sin(a) * 0.18, 0.03, palet);
    });
    k.lengan[0].add(palet);
    k.lengan[1].rotation.x = -1.3;
    const kuas = new THREE.Group(); kuas.position.set(0, -0.62, 0.1); kuas.rotation.x = 1.0;
    kotak(0.04, 0.42, 0.04, mat("#8b5a2b"), 0, 0.18, 0, kuas);
    kotak(0.06, 0.1, 0.06, mat("#e74c3c"), 0, 0.42, 0, kuas);
    k.lengan[1].add(kuas);
  },
  rio(k) {
    const hp = mat("#2a2d33");
    kotak(0.62, 0.06, 0.1, hp, 0, 1.94, 0, k.g); // headphone
    for (const sx of [-0.3, 0.3]) { kotak(0.06, 0.32, 0.1, hp, sx, 1.8, 0, k.g); kotak(0.1, 0.22, 0.22, mat("#e74c3c"), sx * 1.08, 1.56, 0, k.g); }
    k.lengan[1].rotation.x = -0.9; k.lengan[1].rotation.z = -0.1;
    const kam = new THREE.Group(); kam.position.set(0, -0.66, 0.12); kam.rotation.x = 0.9;
    kotak(0.34, 0.24, 0.3, HITAM, 0, 0.06, 0, kam);
    const lensa = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.18, 16), mat("#3d4350")); lensa.rotation.x = Math.PI / 2; lensa.position.set(0, 0.06, 0.22); kam.add(lensa);
    kotak(0.05, 0.05, 0.02, mat("#ff3b3b", { emissive: "#ff3b3b", emissiveIntensity: 2 }), 0.12, 0.15, 0.16, kam);
    k.lengan[1].add(kam);
  },
  salsa(k) {
    k.lengan[1].rotation.x = -0.75;
    const globe = new THREE.Group(); globe.position.set(0.05, -0.74, 0.14); globe.scale.setScalar(0.8);
    const bola = new THREE.Mesh(new THREE.IcosahedronGeometry(0.24, 2), mat("#3b82f6", { flatShading: true }));
    globe.add(bola);
    for (const [x, y, z] of [[0.12, 0.08, 0.18], [-0.1, -0.06, 0.2], [0.02, 0.17, 0.12]]) kotak(0.12, 0.08, 0.06, mat("#27ae60"), x, y, z, globe);
    k.lengan[1].add(globe);
    // gelembung bicara
    for (const [x, y, c] of [[-0.62, 2.15, "#ffffff"], [0.62, 2.3, "#ffe066"]]) {
      kotak(0.42, 0.26, 0.06, mat(c), x, y, 0, k.g);
      kotak(0.08, 0.08, 0.06, mat(c), x + (x < 0 ? 0.12 : -0.12), y - 0.16, 0, k.g);
      for (let i = 0; i < 3; i++) kotak(0.05, 0.05, 0.02, mat("#5b6475"), x - 0.1 + i * 0.1, y, 0.04, k.g);
    }
  },

  // ---- Distribution & Growth ----
  nadia(k) {
    // tablet berisi grafik naik
    k.lengan[1].rotation.x = -1.15; k.lengan[0].rotation.x = -1.0; k.lengan[0].rotation.z = 0.3;
    const tab = new THREE.Group(); tab.position.set(-0.15, -0.6, 0.2); tab.rotation.set(1.15, 0.25, 0);
    kotak(0.6, 0.42, 0.04, HITAM, 0, 0.1, 0, tab);
    kotak(0.54, 0.36, 0.02, PUTIH, 0, 0.1, 0.025, tab);
    [0.1, 0.16, 0.24, 0.3].forEach((t, i) => kotak(0.08, t, 0.02, ikon(i === 3 ? "#1e9e5a" : "#82e0aa"), -0.18 + i * 0.12, -0.06 + t / 2, 0.04, tab));
    k.lengan[1].add(tab);
    // panah naik di atas kepala
    const panah = new THREE.Group(); panah.position.set(0.5, 1.95, 0); panah.rotation.z = -0.6; panah.scale.setScalar(0.85);
    kotak(0.08, 0.42, 0.06, ikon("#1e9e5a"), 0, 0, 0, panah);
    const ujung = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.2, 4), ikon("#1e9e5a")); ujung.position.y = 0.3; panah.add(ujung);
    k.g.add(panah);
  },
  taufik(k) {
    // admin sosmed: ponsel + notifikasi like & komentar
    k.lengan[1].rotation.x = -1.25; k.lengan[1].rotation.z = 0.1;
    const hp = new THREE.Group(); hp.position.set(0, -0.62, 0.12); hp.rotation.x = 1.25;
    kotak(0.24, 0.42, 0.04, HITAM, 0, 0.1, 0, hp);
    kotak(0.2, 0.36, 0.02, ikon("#c7f0d8"), 0, 0.1, 0.025, hp);
    k.lengan[1].add(hp);
    gelembung(k, -0.6, 2.1, "#ff5a76", (x, y) => {
      for (const [dx, dy] of [[-0.05, 0.03], [0.05, 0.03], [0, -0.04]]) kotak(0.08, 0.08, 0.04, mat("#ffffff"), x + dx, y + dy, 0.04, k.g);
    });
    gelembung(k, 0.62, 2.3, "#ffffff", (x, y) => { for (let i = 0; i < 3; i++) kotak(0.05, 0.05, 0.02, mat("#5b6475"), x - 0.1 + i * 0.1, y, 0.04, k.g); });
  },
  umar(k) {
    // kaca pembesar (pencarian)
    k.lengan[1].rotation.x = -0.95; k.lengan[1].rotation.z = 0.5;
    const kaca = new THREE.Group(); kaca.position.set(0, -0.65, 0.12); kaca.rotation.set(0.95, 0, -0.5);
    const bingkai = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.035, 10, 28), mat("#3d4350")); bingkai.position.y = 0.3; kaca.add(bingkai);
    const lensa = new THREE.Mesh(new THREE.CircleGeometry(0.16, 28), new THREE.MeshStandardMaterial({ color: "#bfe8ff", transparent: true, opacity: 0.55 }));
    lensa.position.y = 0.3; kaca.add(lensa);
    kotak(0.05, 0.22, 0.05, mat("#8b5a2b"), 0, 0.04, 0, kaca);
    k.lengan[1].add(kaca);
  },
  vina(k) {
    // amplop newsletter + amplop terbang
    k.lengan[1].rotation.x = -1.1; k.lengan[0].rotation.x = -1.1;
    k.lengan[0].rotation.z = 0.25; k.lengan[1].rotation.z = -0.25;
    const amplop = (x, y, z, s, rot = 0) => {
      const a = new THREE.Group(); a.position.set(x, y, z); a.scale.setScalar(s); a.rotation.z = rot;
      kotak(0.46, 0.3, 0.04, PUTIH, 0, 0, 0, a);
      const tutup = kotak(0.33, 0.33, 0.02, mat("#e8e8e4"), 0, 0.08, 0.025, a); tutup.rotation.z = Math.PI / 4; tutup.scale.y = 0.5;
      kotak(0.08, 0.08, 0.02, ikon("#1e9e5a"), 0, -0.02, 0.04, a);
      k.g.add(a);
    };
    amplop(0, 0.88, 0.44, 1.25);
    amplop(-0.62, 2.05, 0, 0.85, 0.25);
    amplop(0.64, 2.3, 0, 0.75, -0.3);
  },
  wulan(k) {
    // megafon untuk pitching
    k.lengan[1].rotation.x = -1.35; k.lengan[1].rotation.z = -0.35;
    const mega = new THREE.Group(); mega.position.set(0, -0.62, 0.1); mega.rotation.x = Math.PI / 2 + 0.3;
    const corong = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.07, 0.42, 20, 1, true), mat("#1e9e5a", { side: THREE.DoubleSide }));
    corong.position.y = 0.26; mega.add(corong);
    kotak(0.06, 0.16, 0.06, HITAM, 0, -0.02, 0.06, mega);
    k.lengan[1].add(mega);
    for (const [y, s] of [[1.9, 0.5], [2.15, 0.75]]) {
      const gel = new THREE.Mesh(new THREE.TorusGeometry(0.2 * s, 0.025, 6, 20, Math.PI * 0.7), ikon("#1e9e5a"));
      gel.position.set(0.55, y, 0.2); gel.rotation.z = -0.35; k.g.add(gel);
    }
  },
  yoga(k) {
    // papan target iklan + panah
    k.lengan[0].rotation.x = -1.0; k.lengan[0].rotation.z = 0.2;
    const target = new THREE.Group(); target.position.set(0, -0.66, 0.12); target.rotation.x = 1.0;
    ["#e74c3c", "#ffffff", "#e74c3c", "#ffffff", "#e74c3c"].forEach((c, i) => {
      const r = 0.3 - i * 0.06;
      const cakram = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.03, 28), mat(c));
      cakram.rotation.x = Math.PI / 2; cakram.position.z = i * 0.006; target.add(cakram);
    });
    const anak = new THREE.Group(); anak.position.set(0.04, 0.03, 0.05); anak.rotation.set(-0.5, 0.4, 0);
    kotak(0.03, 0.03, 0.4, mat("#3d4350"), 0, 0, 0.2, anak);
    kotak(0.1, 0.02, 0.1, ikon("#1e9e5a"), 0, 0, 0.38, anak);
    target.add(anak);
    k.lengan[0].add(target);
    // koin di tangan kanan
    k.lengan[1].rotation.x = -0.6;
    const koin = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.04, 20), mat("#f5c518", { metalness: 0.4, roughness: 0.3 }));
    koin.position.set(0, -0.66, 0.1); k.lengan[1].add(koin);
  },

  // ---- Business & Monetization ----
  hendra(k) {
    kotak(0.11, 0.4, 0.02, mat("#1f2633"), 0, 0.92, 0.18, k.g); // dasi
    kotak(0.2, 0.08, 0.02, PUTIH, 0, 1.2, 0.175, k.g); // kerah
    // koper di tangan kanan
    k.lengan[1].rotation.x = -0.15; k.lengan[1].rotation.z = 0.08;
    const koper = new THREE.Group(); koper.position.set(0.02, -0.82, 0.05);
    kotak(0.5, 0.36, 0.14, mat("#5b3a1a"), 0, -0.12, 0, koper);
    kotak(0.5, 0.04, 0.15, mat("#d4a017", { metalness: 0.5, roughness: 0.3 }), 0, -0.02, 0, koper);
    kotak(0.16, 0.06, 0.05, HITAM, 0, 0.09, 0, koper);
    k.lengan[1].add(koper);
    // tumpukan koin melayang
    const emas = mat("#f5c518", { metalness: 0.45, roughness: 0.3, emissive: "#f5c518", emissiveIntensity: 0.15 });
    for (let i = 0; i < 4; i++) {
      const c = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 22), emas);
      c.position.set(-0.78 + (i % 2) * 0.02, 1.45 + i * 0.06, 0.1); k.g.add(c);
    }
    const kn = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.05, 22), emas);
    kn.position.set(0.66, 2.0, 0.1); kn.rotation.x = Math.PI / 2; kn.rotation.z = 0.4; k.g.add(kn);
  },
  dina(k) {
    // map proposal sponsorship
    k.lengan[1].rotation.x = -1.15; k.lengan[0].rotation.x = -1.0; k.lengan[0].rotation.z = 0.3;
    const map = new THREE.Group(); map.position.set(-0.12, -0.62, 0.16); map.rotation.set(1.15, 0.25, 0);
    kotak(0.44, 0.56, 0.04, mat("#1f3a6b"), 0, 0.1, 0, map);
    kotak(0.44, 0.06, 0.045, ikon("#f1c40f"), 0, 0.3, 0.002, map);
    kotak(0.18, 0.18, 0.02, ikon("#f1c40f"), 0, 0.05, 0.03, map);
    k.lengan[1].add(map);
    gelembung(k, 0.62, 2.25, "#ffffff", (x, y) => { // ikon jabat tangan sederhana
      kotak(0.1, 0.06, 0.03, mat("#f0c8a4"), x - 0.05, y, 0.04, k.g); kotak(0.1, 0.06, 0.03, mat("#d9a87e"), x + 0.05, y, 0.045, k.g);
    });
  },
  eko(k) {
    // label harga (rate card)
    k.lengan[1].rotation.x = -1.2; k.lengan[1].rotation.z = 0.15;
    const tag = new THREE.Group(); tag.position.set(0, -0.62, 0.12); tag.rotation.set(1.2, 0, 0.35);
    kotak(0.34, 0.24, 0.03, ikon("#f1c40f"), 0, 0.2, 0, tag);
    const ujung = kotak(0.17, 0.17, 0.03, ikon("#f1c40f"), -0.17, 0.2, 0, tag); ujung.rotation.z = Math.PI / 4;
    const lubang = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.04, 12), PUTIH); lubang.rotation.x = Math.PI / 2; lubang.position.set(-0.17, 0.2, 0.01); tag.add(lubang);
    for (let i = 0; i < 2; i++) kotak(0.16 - i * 0.05, 0.03, 0.02, mat("#6b4e0a"), 0.04, 0.24 - i * 0.07, 0.02, tag);
    k.lengan[1].add(tag);
    gelembung(k, -0.6, 2.15, "#ffffff", (x, y) => { // grafik mini
      [0.06, 0.1, 0.14].forEach((t, i) => kotak(0.05, t, 0.02, ikon("#b07800"), x - 0.08 + i * 0.08, y - 0.07 + t / 2, 0.04, k.g));
    });
  },
  fani(k) {
    // piringan hitam (lisensi musik) + roll film
    k.lengan[1].rotation.x = -0.8; k.lengan[1].rotation.z = 0.35;
    const vinyl = new THREE.Group(); vinyl.position.set(0.04, -0.66, 0.12); vinyl.rotation.set(0.8, 0, -0.35); vinyl.scale.setScalar(0.85);
    const piring = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.02, 36), mat("#151515", { roughness: 0.35 }));
    piring.rotation.x = Math.PI / 2; piring.position.y = 0.22; vinyl.add(piring);
    const label = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.025, 24), ikon("#f1c40f"));
    label.rotation.x = Math.PI / 2; label.position.y = 0.22; vinyl.add(label);
    k.lengan[1].add(vinyl);
    const reel = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.05, 8, 18), mat("#3d4350"));
    reel.position.set(-0.62, 2.1, 0); k.g.add(reel);
    for (let i = 0; i < 3; i++) kotak(0.05, 0.05, 0.03, PUTIH, -0.62 + Math.cos(i * 2.1) * 0.06, 2.1 + Math.sin(i * 2.1) * 0.06, 0.03, k.g);
  },
  gilang(k) {
    // kaos merchandise + tiket event
    for (const l of k.lengan) l.rotation.x = -1.05;
    k.lengan[0].rotation.z = 0.28; k.lengan[1].rotation.z = -0.28;
    const kaos = new THREE.Group(); kaos.position.set(0, 0.9, 0.44); kaos.rotation.x = -0.3; kaos.scale.setScalar(1.35);
    const warnaKaos = mat("#1f3a6b");
    kotak(0.34, 0.4, 0.03, warnaKaos, 0, 0, 0, kaos);
    for (const sx of [-0.22, 0.22]) { const l = kotak(0.14, 0.12, 0.03, warnaKaos, sx, 0.13, 0, kaos); l.rotation.z = sx > 0 ? -0.5 : 0.5; }
    kotak(0.14, 0.14, 0.02, ikon("#f1c40f"), 0, 0.02, 0.02, kaos);
    k.g.add(kaos);
    const tiket = new THREE.Group(); tiket.position.set(0.6, 2.2, 0.05); tiket.rotation.z = -0.3;
    kotak(0.42, 0.2, 0.03, ikon("#f1c40f"), 0, 0, 0, tiket);
    kotak(0.02, 0.2, 0.035, PUTIH, 0.1, 0, 0, tiket);
    kotak(0.16, 0.03, 0.035, mat("#6b4e0a"), -0.06, 0.03, 0.002, tiket);
    k.g.add(tiket);
  },
  hesti(k) {
    // kartu member emas + bintang
    k.lengan[1].rotation.x = -1.25; k.lengan[1].rotation.z = 0.1;
    const kartu = new THREE.Group(); kartu.position.set(0, -0.62, 0.12); kartu.rotation.set(1.25, 0, 0.2);
    kotak(0.42, 0.27, 0.03, mat("#e0b100", { metalness: 0.5, roughness: 0.25 }), 0, 0.18, 0, kartu);
    kotak(0.42, 0.05, 0.035, HITAM, 0, 0.24, 0, kartu);
    kotak(0.08, 0.06, 0.035, PUTIH, -0.12, 0.13, 0.002, kartu);
    k.lengan[1].add(kartu);
    const bintang = new THREE.Group(); bintang.position.set(-0.6, 2.15, 0.05);
    for (let i = 0; i < 2; i++) { const b = kotak(0.2, 0.2, 0.05, ikon("#f5c518"), 0, 0, 0, bintang); b.rotation.z = Math.PI / 4 * i; }
    k.g.add(bintang);
    const mahkota = new THREE.Group(); mahkota.position.set(0.6, 2.25, 0.05);
    kotak(0.3, 0.1, 0.05, ikon("#f5c518"), 0, 0, 0, mahkota);
    for (const dx of [-0.11, 0, 0.11]) kotak(0.07, 0.1, 0.05, ikon("#f5c518"), dx, 0.09, 0, mahkota);
    k.g.add(mahkota);
  },
};

// ---------- Render tiap kartu ----------
for (const cv of document.querySelectorAll("canvas[data-agent]")) {
  const id = cv.dataset.agent;
  const besar = id === D.kepala.id;
  const info = besar ? D.kepala : D.tim.find((a) => a.id === id);
  const [w, h] = [cv.width, cv.height]; // baca sebelum renderer mengubah ukuran kanvas
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(2);
  renderer.setSize(w, h, true);
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight("#ffffff", D.cahayaBawah, 1.7));
  const sun = new THREE.DirectionalLight("#fff4ea", 2.4);
  sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1 });
  sun.shadow.radius = 6;
  scene.add(sun);
  const rim = new THREE.DirectionalLight("#ffffff", 1.1); rim.position.set(-3, 3, -2); scene.add(rim);

  const alas = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.92, 0.16, 48), mat(besar ? D.alasKepala : D.alasTim));
  alas.position.y = -0.08; alas.receiveShadow = true; scene.add(alas);
  const cincin = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.04, 48), mat("#ffffff"));
  cincin.position.y = -0.17; scene.add(cincin);

  const k = karakter(besar ? D.bajuKepala : D.bajuTim, info.rambut, info.panjang);
  PROP[id]?.(k);
  k.g.rotation.y = -0.38;
  scene.add(k.g);

  const cam = new THREE.PerspectiveCamera(besar ? 30 : 32, w / h, 0.1, 50);
  cam.position.set(1.5, besar ? 1.7 : 1.85, besar ? 5.6 : 5.0);
  cam.lookAt(0, besar ? 0.95 : 1.0, 0);
  renderer.render(scene, cam);
}
document.body.dataset.siap = "1";
</script>
</body>
</html>
